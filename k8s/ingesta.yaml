apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentmetrics-ingesta
  namespace: rentmetrics
  labels:
    app: rentmetrics-ingesta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rentmetrics-ingesta
  template:
    metadata:
      labels:
        app: rentmetrics-ingesta
    spec:
      containers:
      - name: ingesta-api
        image: rentmetrics/ingesta:v3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: rentmetrics-config
        - secretRef:
            name: rentmetrics-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rentmetrics-ingesta-svc
  namespace: rentmetrics
  labels:
    app: rentmetrics-ingesta
spec:
  type: ClusterIP
  selector:
    app: rentmetrics-ingesta
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rentmetrics-ingesta-hpa
  namespace: rentmetrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rentmetrics-ingesta
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
